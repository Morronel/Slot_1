<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0420">
  <title>Starfall Casino</title>
  <meta name="description" content="Free play-money slots, roulette and blackjack that run entirely in your browser.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%AD%90%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/lobby.css">
</head>
<body class="lobby-page">
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"></div>

  <main class="lobby" data-games-lobby>
    <header class="lobby-head">
      <h1 class="logo lobby-logo" aria-label="Starfall Casino"><span>STARFALL</span><em>CASINO</em></h1>
      <p class="lobby-sub">Pick a game. One play-money balance follows you to every table.</p>
      <div class="lobby-bal" aria-live="polite">
        <span class="lobby-bal-label">Balance</span>
        <output id="lobby-balance">10,000</output>
      </div>
    </header>

    <nav class="lobby-grid" id="lobby-grid" aria-label="Games"></nav>

    <p class="fineprint">Play money only. No real money, no purchases, nothing to win but bragging rights.</p>
  </main>

  <script src="js/nav.js" defer></script>
  <script type="module" src="js/lobby.js"></script>
</body>
</html>
